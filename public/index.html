

<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Number Duel 🎮</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #101323;
      color: white;
      text-align: center;
    }
    .game {
      max-width: 420px;
      margin: 35px auto;
      padding: 24px;
      background: #202640;
      border-radius: 20px;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
    }
    button {
      background: #6c63ff;
      color: white;
      font-weight: bold;
    }
    input { background: white; }
    #status { margin-top: 20px; min-height: 48px; }
  </style>
</head>
<body>
  <div class="game">
    <h1>🎮 Number Duel</h1>
    <p>Gjej numrin nga 1 deri në 100!</p>

    <button id="create">Krijo dhomë</button>
    <input id="room" placeholder="Shkruaj kodin e dhomës">
    <button id="join">Bashkohu në dhomë</button>

    <hr style="margin-top:24px">

    <input id="guess" type="number" min="1" max="100"
      placeholder="Numri yt (1–100)">
    <button id="send">Provo numrin</button>

    <p id="status">Duke u lidhur me serverin...</p>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const status = document.getElementById("status");
    const roomInput = document.getElementById("room");
    let roomCode = "";

    socket.on("connect", () => {
      status.textContent = "U lidhëm! Krijo ose bashkohu në një dhomë.";
    });

    socket.on("connect_error", () => {
      status.textContent = "Nuk lidhet me serverin. Provo ta rifreskosh faqen.";
    });

    document.getElementById("create").onclick = () => {
      socket.emit("createRoom");
    };

    socket.on("roomCreated", (code) => {
      roomCode = code;
      roomInput.value = code;
      status.textContent = "Dhoma u krijua! Dërgoja kodin shokut: " + code;
    });

    document.getElementById("join").onclick = () => {
      roomCode = roomInput.value.trim().toUpperCase();
      socket.emit("joinRoom", roomCode);
    };

    document.getElementById("send").onclick = () => {
      const number = Number(document.getElementById("guess").value);
      if (!roomCode) {
        status.textContent = "Krijo një dhomë ose bashkohu me një kod!";
        return;
      }
      socket.emit("guess", { code: roomCode, number });
    };

    socket.on("gameMessage", (message) => {
      status.textContent = message;
    });
  </script>
</body>
</html>
